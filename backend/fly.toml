# fly.toml app configuration file generated for backend-billowing-sunset-5387 on 2026-01-09T16:47:02+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'smart-notes-api'
primary_region = 'nrt'

# Grace period between SIGTERM and SIGKILL. Long enough for an in-flight note
# job to finish; the process exits as soon as it is done, so an idle machine
# still stops immediately.
kill_timeout = "30s"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
